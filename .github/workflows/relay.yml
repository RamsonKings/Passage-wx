name: Weather relay

on:
  schedule:
    - cron: "40 1,7,13,19 * * *"   # every 6 h, ~1 h 40 min after each model run
  workflow_dispatch: {}            # "Run workflow" button
  push:
    paths: ["route.txt", "index.html", "relay.py", ".github/workflows/relay.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install numpy scipy requests xarray netCDF4 eccodes ecmwf-opendata copernicusmarine

      - name: Build relay.json
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASS }}
        run: |
          mkdir -p _site
          python relay.py
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
